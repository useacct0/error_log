<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Error Log</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header>
			<nav class="navbar">
				<ul>
					<a href="./index.html"<li>Error Log</li></a>
					<a href="./add_topic.html"<li>Add Topic</li></a>
					<a href="./help.html"<li>Set Up</li></a>
				</ul>
			</nav>
			<h1 class="heading" id="heading">Error Log</h1>
			<div class="buttons">
				<a href='./add_topic.html'><button class="btn">Add Topic</button></a>
				<button class="btn" id="load">Load Folder</button>
				<a href='./problem_sets.html'><button class="btn">Problem Sets</button></a>
			</div>
		</header>
		<main>
			<div id="topics"></div>
		</main>
		<footer>&copy; 2026 Divyansh Sharma. All rights reserved.</footer>
	</body>
	<script src="indexedDBhelper.js"></script>
	<script>
	
		const table = document.getElementById("topics");
		let directoryHandle;
		
		document.getElementById('load').addEventListener('click', async (event) => {
			event.preventDefault();
				
			<!-- We get the topics data from text file -->
			try {
				directoryHandle = await getDirHandle();
				
				if (directoryHandle){
					const options = {mode: 'read'};
					if ((await directoryHandle.queryPermission(options)) !== 'granted'){
						if ((await directoryHandle.requestPermission(options)) !== 'granted'){
							console.error("Permission denied by user");
							return;
						}
					}
				}
				if (!directoryHandle || directoryHandle == null){
					directoryHandle = await window.showDirectoryPicker();
					if (!directoryHandle){
						alert("Please select a folder first!");
						return;
					}
				};
				
				await saveDirHandle(directoryHandle);
				
				const textFileHandle = await directoryHandle.getFileHandle("topics.txt", {create: true});
				const file = await textFileHandle.getFile();
				const existingText = await file.text();
				const topics = existingText.split("\n");
				
				for (const topicdata of topics) {
					const topicdataSplit = topicdata.split("_");
					const key = topicdataSplit[0];
					const value = topicdataSplit[1];
					
				<!-- We add topics to frontend here -->
					let topic = document.createElement("div");
					topic.classList.add("topic");
					topic.innerHTML = "<h2>"+key+"</h2><br><p class='sub'>"+value+"</p><button id='"+key+"' class='btn opentopic'>Open Topic</btn>";
					table.appendChild(topic);
				};
			
			} catch (error) {
				console.error("Error reading the file! Or error choosing a directory.", error);
			}
		});
		
		
		document.addEventListener('click', (event) => {
			if (event.target.classList.contains('opentopic')){
				window.location = "./topic.html?topic="+event.target.id;
			};
		})
	</script>
</html>
