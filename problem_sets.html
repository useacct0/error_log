<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Problem Set</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header>
			<nav class="navbar">
				<ul>
					<a href="./index.html"<li>Error Log</li></a>
					<a href="./add_topic.html"<li>Add Topic</li></a>
				</ul>
			</nav>
			<h1 class="heading" id="heading">Create Problem Set</h1>
			<p style="text-align: center;">The following creates a set of <i>n</i> problems randomly from your topic.</p>
			<div class="buttons" id="buttons">
				<button id="load_p" class="btn">Load Folder</button>
			</div>
		</header>
		<main>
			<form class="form-section" id="selectorContainer">
				<label class='form-label'>Choose a topic</label>
				<select id="topicSelector" name="topicSelector" class="form-input">
					<option disabled selected>Load the folder</option>
				</select>
				<br>
			</form>
		</main>
		<footer>&copy; 2026 Divyansh Sharma. All rights reserved.</footer>
	</body>
	<script src="indexedDBhelper.js"></script>
	<script>
		
		let directoryHandle;
		const load_p = document.getElementById("load_p");
		let topicList = [];
		load_p.addEventListener('click', async () => {
			try {
				directoryHandle = await getDirHandle();
				
				const options = {mode: 'read'};
				if ((await directoryHandle.queryPermission(options)) !== 'granted'){
					if ((await directoryHandle.requestPermission(options)) !== 'granted'){
						console.error("Permission denied by user");
						return;
					}
				}
				
				const textFileHandle = await directoryHandle.getFileHandle("topics.txt", {create: true});
				const file = await textFileHandle.getFile();
				const existingText = await file.text();
				const topics = existingText.split("\n");
				
				for (const topicdata of topics) {
					const topicdataSplit = topicdata.split("_");
					const key = topicdataSplit[0];
					topicList.push(key);
				};
				
				const container = document.getElementById("selectorContainer");
				const topicSelectorInput = document.getElementById("topicSelector");
				
				topicSelectorInput.innerHTML = '<option disabled selected>Select a topic</option>'+topicList.map(topic => `<option value='${topic}'>${topic}</option>`).join("");
			
				const problems = document.createElement("label");
				problems.classList.add("form-label");
				problems.innerText = "Enter the amount of questions";
				
				const problemsInput = document.createElement("input");
				problemsInput.type = "number";
				problemsInput.classList.add("form-input");
				problemsInput.id = "qn_amt";
				problemsInput.placeholder = "Eg. 25";
				
				const createSetBtn = document.createElement("button");
				createSetBtn.classList.add("btn");
				createSetBtn.id = "create_set";
				createSetBtn.type = "submit";
				createSetBtn.innerText = "Create Set";
				
				container.appendChild(problems);
				container.appendChild(problemsInput);
				container.appendChild(document.createElement("br"));
				container.appendChild(createSetBtn);
			} catch (error) {
				console.error("Error while loading the folder.", error);
			}
		});
		
		const form = document.getElementById("selectorContainer");
		form.addEventListener('submit', async (event) => {
			try {
				event.preventDefault();
				const topic = document.getElementById("topicSelector").value;
				const qn_amt = document.getElementById("qn_amt").value;
				form.reset();
				window.location = `./new_problem_set.html?topic=${topic}&qn_amt=${qn_amt}`;
			} catch (error) {
				alert("Error submitting the form.");
				console.log("Error while submitting the form\n", error);
			}
		});
	</script>
</html>
